name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_data:
        description: 'Also run the pipeline and publish the dataset to the hub'
        type: boolean
        default: false
      max_samples:
        description: 'Images to ingest when with_data is set (cap 500)'
        type: string
        default: '400'
      version:
        description: 'Dataset version folder published as av-datamate/<version>'
        type: string
        default: 'v1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: lint
        run: ruff check .
      - name: unit tests (synthetic fixtures, no network)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/av-datamate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test the pushed image
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ github.sha }} python -c "import avdatamate, gradio; print('imports ok', gradio.__version__)"
          docker run --rm ${{ env.IMAGE }}:${{ github.sha }} avdatamate --help >/dev/null && echo "cli ok"

  deploy-hf:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: deploy Space code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_hf.py --code-only
      - name: build dataset and publish
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.with_data == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MAX=$(python -c "print(min(500, int('${{ github.event.inputs.max_samples }}' or 400)))")
          PYTHONPATH=src python -m avdatamate --out out run --max-samples "$MAX"
          python scripts/publish_hf.py --version '${{ github.event.inputs.version }}' --skip-space
