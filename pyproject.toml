[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "av-datamate"
version = "1.0.0"
description = "Autonomous-driving dataset pipeline: ingest -> validate -> YOLO convert -> split -> report -> publish"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "av-datamate" }]
dependencies = [
    "huggingface_hub==1.33.0",
    "Pillow==11.3.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
app = ["gradio==5.50.0"]
dev = ["pytest==8.4.2", "ruff==0.14.14"]

[project.scripts]
avdatamate = "avdatamate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["third_party", "out", "cache", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP035", "UP006", "UP007", "B008", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
